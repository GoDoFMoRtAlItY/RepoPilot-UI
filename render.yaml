services:
  - type: web
    name: repopilot-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
    plan: free
